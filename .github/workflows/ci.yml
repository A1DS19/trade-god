name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: research (python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.14 is what the dev machine runs and what the suite is green on.
          # The old 3.12 pin came from the retired Dockerfile, now in legacy/.
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        # requirements-research.txt as well, and not as a nicety:
        # tests/research/conftest.py calls pytest.importorskip("pyarrow"), so an
        # install without it SKIPS all 111 tests and the job still exits 0.
        run: pip install -r requirements.txt -r requirements-research.txt

      - name: Guard against a silently empty suite
        # The failure this repo keeps re-learning is a green run over code that
        # never executed. Fail loudly here instead of reporting "1 skipped".
        run: python -c "import pandas, pyarrow, numpy, binance, psycopg"

      - name: Check for syntax errors
        # research/ is the only code this repo still ships. Its CLI entry
        # points (backfill, check) are not all import-covered by the suite, so a
        # syntax check still earns its place. compileall walks the package, so a
        # new module is covered the moment it lands.
        run: python -m compileall -q research

      - name: Run tests
        run: python -m pytest -q

