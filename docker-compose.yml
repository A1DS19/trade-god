services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c shared_buffers=16MB -c max_connections=20 -c work_mem=2MB
    environment:
      POSTGRES_USER: tradegod
      POSTGRES_PASSWORD: tradegod
      POSTGRES_DB: tradegod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    mem_limit: 80m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradegod -d tradegod"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 200m
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python api_main.py
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 150m
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
