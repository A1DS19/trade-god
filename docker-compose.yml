services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradegod
      POSTGRES_PASSWORD: tradegod
      POSTGRES_DB: tradegod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradegod -d tradegod"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tradegod:tradegod@db:5432/tradegod
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
